spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 3

server:
  port: ${PORT:8080}

logging:
  level:
    org.flywaydb: DEBUG




